name: Build UWP starter
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true


on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - xbox-horizon-shell-v2
      - horizon-uwp-engine-port
  pull_request:
    branches:
      - main
      - master
      - xbox-horizon-shell-v2

jobs:
  build:
    name: Build Horizon Xbox Starter
    runs-on: windows-2022

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Extract project files
        shell: pwsh
        run: |
          Write-Host "Looking for the project..."

          $solution = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "HorizonXboxStarter.sln" `
            -File -Recurse |
            Select-Object -First 1

          $sourceRoot = $env:GITHUB_WORKSPACE

          if (-not $solution) {
            Write-Host "Solution not found. Looking for ZIP..."

            $zip = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "HorizonXboxStarter.zip" `
              -File -Recurse |
              Select-Object -First 1

            if (-not $zip) {
              throw "HorizonXboxStarter.zip was not found!"
            }

            $extractDir = Join-Path $env:RUNNER_TEMP "HorizonProject"

            New-Item -ItemType Directory `
              -Path $extractDir -Force | Out-Null

            Expand-Archive `
              -LiteralPath $zip.FullName `
              -DestinationPath $extractDir `
              -Force

            $sourceRoot = $extractDir

            Write-Host "ZIP extracted successfully."

            $solution = Get-ChildItem `
              -Path $extractDir `
              -Filter "HorizonXboxStarter.sln" `
              -File -Recurse |
              Select-Object -First 1
          }

          if (-not $solution) {
            throw "Could not find HorizonXboxStarter.sln after extraction."
          }

          Write-Host "Found solution: $($solution.FullName)"

          "SOLUTION_PATH=$($solution.FullName)" >> $env:GITHUB_ENV
          "SOURCE_ROOT=$sourceRoot" >> $env:GITHUB_ENV

      - name: Check out pinned Horizon Rust engine
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: 83ad384f48d0742746d518737511882680aab5b7
          path: HorizonEngine

      - name: Set up MSVC environment for x64 UWP
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install nightly Rust and source
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build and package Horizon native bridge
        shell: pwsh
        run: |
          cargo +nightly build --manifest-path HorizonUwpEngineBridge/Cargo.toml --target x86_64-uwp-windows-msvc -Z build-std=std,panic_abort --profile fast
          if ($LASTEXITCODE -ne 0) {
            throw "Horizon's native UWP bridge DLL failed to build."
          }

          $dll = Join-Path $env:GITHUB_WORKSPACE "HorizonUwpEngineBridge/target/x86_64-uwp-windows-msvc/fast/horizon_uwp_engine_bridge.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "The native UWP bridge DLL was not produced: $dll"
          }

          $projectDir = Split-Path -Parent $env:SOLUTION_PATH
          $packageDll = Join-Path $projectDir "horizon_uwp_engine_bridge.dll"
          Copy-Item -LiteralPath $dll -Destination $packageDll -Force

          $projectFile = Join-Path $projectDir "HorizonXboxStarter.csproj"
          if (-not (Test-Path -LiteralPath $projectFile)) {
            $projectFile = Get-ChildItem -Path $projectDir -Filter "*.csproj" -File |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $projectFile) {
            throw "Could not find the UWP project file to include the native bridge."
          }

          [xml]$projectXml = Get-Content -LiteralPath $projectFile -Raw
          $existing = $projectXml.SelectSingleNode("//*[local-name()='Content' and @Include='horizon_uwp_engine_bridge.dll']")
          if (-not $existing) {
            $ns = $projectXml.DocumentElement.NamespaceURI
            $group = $projectXml.SelectSingleNode("//*[local-name()='ItemGroup']")
            if (-not $group) {
              $group = $projectXml.CreateElement("ItemGroup", $ns)
              [void]$projectXml.DocumentElement.AppendChild($group)
            }
            $content = $projectXml.CreateElement("Content", $ns)
            $content.SetAttribute("Include", "horizon_uwp_engine_bridge.dll")
            [void]$group.AppendChild($content)

            $settings = [System.Xml.XmlWriterSettings]::new()
            $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
            $settings.Indent = $true
            $writer = [System.Xml.XmlWriter]::Create($projectFile, $settings)
            try {
              $projectXml.Save($writer)
            } finally {
              $writer.Dispose()
            }
          }

          Write-Host "Included the x64 UWP Rust bridge DLL in the UWP project."

      - name: Apply improved Xbox UWP shell
        shell: pwsh
        run: |
          $projectDir = Split-Path -Parent $env:SOLUTION_PATH
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE "UwpSource"

          foreach ($file in @("App.xaml", "MainPage.xaml", "MainPage.xaml.cs")) {
            $sourceFile = Join-Path $sourceDir $file
            if (-not (Test-Path -LiteralPath $sourceFile)) {
              throw "Improved shell source missing: $sourceFile"
            }

            Copy-Item -LiteralPath $sourceFile -Destination (Join-Path $projectDir $file) -Force
            Write-Host "Applied $file"
          }

          Write-Host "Applied the redesigned Xbox shell."
        
      - name: Remove incompatible Xamarin.Forms XAML attribute
        shell: pwsh
        run: |
          $projectDir = Split-Path -Parent $env:SOLUTION_PATH
          $assemblyInfo = Join-Path $projectDir "Properties/AssemblyInfo.cs"

          if (-not (Test-Path -LiteralPath $assemblyInfo)) {
            throw "AssemblyInfo.cs was not found: $assemblyInfo"
          }

          $source = Get-Content -LiteralPath $assemblyInfo -Raw
          $pattern = '(?m)^\s*\[assembly:\s*XamlCompilation\([^\r\n]*\)\]\s*\r?\n?'
          $updated = [regex]::Replace($source, $pattern, '')

          if ($updated -eq $source) {
            Write-Host "No Xamarin.Forms XamlCompilation assembly attribute was present."
          } else {
            Set-Content -LiteralPath $assemblyInfo -Value $updated -NoNewline -Encoding utf8
            Write-Host "Removed the unsupported XamlCompilation assembly attribute."
          }

      - name: Add required PhoneIdentity to app manifest
        shell: pwsh
        run: |
          $projectDir = Split-Path -Parent $env:SOLUTION_PATH
          $manifest = Get-ChildItem -Path $projectDir -Filter "Package.appxmanifest" -File -Recurse |
            Select-Object -First 1

          if (-not $manifest) {
            throw "Package.appxmanifest was not found under $projectDir"
          }

          [xml]$xml = Get-Content -LiteralPath $manifest.FullName -Raw
          $root = $xml.DocumentElement
          $phoneNamespace = "http://schemas.microsoft.com/appx/2014/phone/manifest"
          $xmlnsNamespace = "http://www.w3.org/2000/xmlns/"

          # Declare the Phone manifest namespace if it is not already present.
          if (-not $root.HasAttribute("mp", $xmlnsNamespace)) {
            $namespaceAttribute = $xml.CreateAttribute("xmlns", "mp", $xmlnsNamespace)
            $namespaceAttribute.Value = $phoneNamespace
            [void]$root.Attributes.Append($namespaceAttribute)
          }

          # Keep stable identifiers across builds so package identity does not change.
          $productId = "5f7d7d39-b7b6-4d57-9a56-3b3c916a4a01"
          $publisherId = "7c2f5b39-54d6-4d3d-ae9d-d83cae7f1c02"
          $phoneIdentity = $xml.GetElementsByTagName("PhoneIdentity", $phoneNamespace) | Select-Object -First 1

          if (-not $phoneIdentity) {
            $phoneIdentity = $xml.CreateElement("mp", "PhoneIdentity", $phoneNamespace)
            $identity = $root.SelectSingleNode("./*[local-name()='Identity']")

            if ($identity) {
              [void]$root.InsertAfter($phoneIdentity, $identity)
            } else {
              [void]$root.PrependChild($phoneIdentity)
            }
          }

          $phoneIdentity.SetAttribute("PhoneProductId", $productId)
          $phoneIdentity.SetAttribute("PhonePublisherId", $publisherId)

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create($manifest.FullName, $settings)
          try {
            $xml.Save($writer)
          } finally {
            $writer.Dispose()
          }

          Write-Host "Added stable PhoneIdentity to $($manifest.FullName)"

      - name: Create correctly sized splash screen
        shell: pwsh
        run: |
          $projectDir = Split-Path -Parent $env:SOLUTION_PATH
          $assetsDir = Join-Path $projectDir "Assets"
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null

          Add-Type -AssemblyName System.Drawing
          $splashPath = Join-Path $assetsDir "SplashScreen.png"
          $bitmap = [System.Drawing.Bitmap]::new(620, 300)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

          try {
            $graphics.Clear([System.Drawing.Color]::FromArgb(255, 20, 24, 32))
            $font = [System.Drawing.Font]::new("Segoe UI", 30, [System.Drawing.FontStyle]::Regular)
            $brush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::White)
            try {
              $format = [System.Drawing.StringFormat]::new()
              $format.Alignment = [System.Drawing.StringAlignment]::Center
              $format.LineAlignment = [System.Drawing.StringAlignment]::Center
              $graphics.DrawString("Horizon Xbox", $font, $brush, [System.Drawing.RectangleF]::new(0, 0, 620, 300), $format)
              $format.Dispose()
            } finally {
              $brush.Dispose()
              $font.Dispose()
            }

            $bitmap.Save($splashPath, [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }

          [xml]$manifestXml = Get-Content -LiteralPath (Join-Path $projectDir "Package.appxmanifest") -Raw
          $splashElements = $manifestXml.SelectNodes("//*[local-name()='SplashScreen']")
          if (-not $splashElements -or $splashElements.Count -eq 0) {
            throw "The app manifest does not contain a SplashScreen element."
          }

          foreach ($element in $splashElements) {
            $element.SetAttribute("Image", "Assets\SplashScreen.png")
          }

          $manifestPath = Join-Path $projectDir "Package.appxmanifest"
          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create($manifestPath, $settings)
          try {
            $manifestXml.Save($writer)
          } finally {
            $writer.Dispose()
          }

          Write-Host "Created 620x300 splash screen and updated Package.appxmanifest."

      - name: Include generated splash screen in UWP package
        shell: pwsh
        run: |
          $projectDir = Split-Path -Parent $env:SOLUTION_PATH
          $projectFile = Join-Path $projectDir "HorizonXboxStarter.csproj"

          if (-not (Test-Path -LiteralPath $projectFile)) {
            $projectFile = Get-ChildItem -Path $projectDir -Filter "*.csproj" -File |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $projectFile) {
            throw "Could not find the UWP project file."
          }

          [xml]$projectXml = Get-Content -LiteralPath $projectFile -Raw
          $ns = $projectXml.DocumentElement.NamespaceURI
          $existing = $projectXml.SelectSingleNode("//*[local-name()='Content' and @Include='Assets\SplashScreen.png']")

          if (-not $existing) {
            $itemGroup = $projectXml.SelectSingleNode("//*[local-name()='ItemGroup']")
            if (-not $itemGroup) {
              $itemGroup = $projectXml.CreateElement("ItemGroup", $ns)
              [void]$projectXml.DocumentElement.AppendChild($itemGroup)
            }

            $contentItem = $projectXml.CreateElement("Content", $ns)
            $contentItem.SetAttribute("Include", "Assets\SplashScreen.png")
            [void]$itemGroup.AppendChild($contentItem)
          }

          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create($projectFile, $settings)
          try {
            $projectXml.Save($writer)
          } finally {
            $writer.Dispose()
          }

          Write-Host "Added Assets\SplashScreen.png to the UWP Content items in $projectFile."

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Write-Host "Restoring NuGet packages for the solution..."

          nuget restore "$env:SOLUTION_PATH" `
            -NonInteractive `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet package restoration failed."
          }

      - name: Build UWP package
        shell: pwsh
        run: |
          Write-Host "Starting UWP build..."

          # Detect the Release platforms declared by the solution.
          $solutionText = Get-Content -LiteralPath $env:SOLUTION_PATH -Raw
          $releasePlatforms = [regex]::Matches(
            $solutionText,
            '(?m)^\s*Release\|([^=\r\n]+)\s*=\s*Release\|'
          ) | ForEach-Object { $_.Groups[1].Value.Trim() } | Select-Object -Unique

          if (-not $releasePlatforms) {
            throw "No Release solution configurations were found in $env:SOLUTION_PATH"
          }

          Write-Host "Available Release platforms: $($releasePlatforms -join ', ')"

          # Xbox Series S is x64. Prefer the x64 package whenever the
          # solution provides it; only fall back for solutions without x64.
          if ($releasePlatforms -contains "x64") {
            $buildPlatform = "x64"
          } elseif ($releasePlatforms -contains "x86") {
            $buildPlatform = "x86"
          } elseif ($releasePlatforms -contains "Any CPU") {
            $buildPlatform = "Any CPU"
          } else {
            $buildPlatform = $releasePlatforms[0]
          }

          Write-Host "Building Release|$buildPlatform"

          msbuild "$env:SOLUTION_PATH" `
            /m `
            /p:Configuration=Release `
            /p:Platform="$buildPlatform" `
            /p:AppxPackage=true `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /verbosity:normal

          if ($LASTEXITCODE -ne 0) {
            throw "UWP build failed."
          }

      - name: Verify the native bridge is inside the UWP package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sourceRoot = $env:SOURCE_ROOT
          $packages = Get-ChildItem -Path $sourceRoot -File -Recurse |
            Where-Object { $_.Extension -in @(".appx", ".msix") }

          if (-not $packages) {
            throw "No UWP package was produced."
          }

          $verified = $false
          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entry = $archive.Entries |
                Where-Object { $_.FullName -ieq "horizon_uwp_engine_bridge.dll" } |
                Select-Object -First 1
              if ($entry) {
                Write-Host "Verified native bridge in $($package.Name): $($entry.FullName)"
                $verified = $true
              }
            } finally {
              $archive.Dispose()
            }
          }

          if (-not $verified) {
            throw "The UWP package does not contain horizon_uwp_engine_bridge.dll."
          }

      - name: Collect Xbox packages
        if: always()
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "XboxBuild"

          New-Item -ItemType Directory `
            -Path $output -Force | Out-Null

          $sourceRoot = $env:SOURCE_ROOT
          if (-not $sourceRoot) {
            $sourceRoot = $env:GITHUB_WORKSPACE
          }

          $packages = Get-ChildItem `
            -Path $sourceRoot `
            -File -Recurse |
            Where-Object {
              $_.Extension -in @(".appx", ".msix", ".cer")
            }

          foreach ($package in $packages) {
            Copy-Item `
              -LiteralPath $package.FullName `
              -Destination $output -Force
          }

          Write-Host "Package collection finished."
          Get-ChildItem $output

      - name: Upload Xbox build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HorizonXboxStarter-UWP
          path: XboxBuild/*
          if-no-files-found: warn
