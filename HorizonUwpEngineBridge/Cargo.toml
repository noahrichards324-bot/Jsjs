[package]
name = "horizon-uwp-engine-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-client = { path = "../HorizonEngine/crates/horizon-client", default-features = false, features = ["system-allocator"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12"] }
pollster = "0.4"

# Keep Horizon's workspace-specific dependency patches in effect when this
# bridge is built as a separate top-level Cargo package.
[patch.crates-io]
wgpu-hal = { path = "../HorizonEngine/third_party/wgpu-hal" }
naga = { path = "../HorizonEngine/third_party/naga" }
libmimalloc-sys = { path = "../HorizonEngine/third_party/libmimalloc-sys" }

[profile.release]
panic = "abort"
lto = "thin"

[profile.fast]
inherits = "release"
panic = "abort"
lto = false
codegen-units = 16
incremental = true
